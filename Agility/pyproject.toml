[project]
name = "agility"
version = "0.1.0"
description = "Records and replays OSRS agility courses using screen reading"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mss>=10.2.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pynput>=1.8.2",
]

[project.scripts]
agility = "agility:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
